name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Secret scan first, so a leaked secret fails the run straight away.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -O "$base/$file"
          curl -sSfL -O "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $file\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$file" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Scan the repo for secrets
        run: gitleaks dir . --config .gitleaks.toml --no-banner

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest

      - run: npm ci

      # Everything except the end-to-end tests, which run locally with npm run check.
      - run: npm run check:quick
