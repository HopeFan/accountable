<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Accountable</title>
    <script>
      // Runs before the first paint so a reload in dark mode never flashes light.
      // Same rule as lib/theme.ts: dark, or system on a dark device.
      var choice = "system";
      try {
        choice = localStorage.getItem("accountable-theme");
      } catch (e) {
        // storage is blocked; the choice stays system
      }
      if (choice !== "light" && choice !== "dark") choice = "system";
      var dark = choice === "dark";
      try {
        if (choice === "system")
          dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      } catch (e) {
        // no matchMedia; stay light
      }
      if (dark) document.documentElement.setAttribute("data-theme", "dark");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
